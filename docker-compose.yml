version: "3.9"

services:
  cargo-tracker:
    image: cargo-tracker:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cargo-tracker
    ports:
      - "8080:8080"
    environment:
      # JVM options
      JAVA_OPTS: "-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Dfile.encoding=UTF-8 -Duser.timezone=UTC"
      TZ: "UTC"
      # Database configuration (PostgreSQL)
      POSTGRESQL_JDBC_URL: "${POSTGRESQL_JDBC_URL:-jdbc:postgresql://host.docker.internal:5432/postgres}"
      POSTGRESQL_USERNAME: "${POSTGRESQL_USERNAME:-postgres}"
      POSTGRESQL_PASSWORD: "${POSTGRESQL_PASSWORD:-postgres}"
      # Graph traversal service URL
      GRAPH_TRAVERSAL_URL: "${GRAPH_TRAVERSAL_URL:-http://localhost:8080/cargo-tracker/rest/graph-traversal/shortest-path}"
    volumes:
      - cargo-tracker-data:/opt/payara/cargo-tracker-data
    networks:
      - app-network
    restart: unless-stopped

volumes:
  cargo-tracker-data:
    driver: local

networks:
  app-network:
    driver: bridge
