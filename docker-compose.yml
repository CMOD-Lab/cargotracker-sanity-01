version: '3.8'

services:
  cargo-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    image: cargo-tracker:latest
    container_name: cargo-tracker
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      TZ: UTC
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
      # Database connection (provide via .env or override)
      DB_HOST: ${DB_HOST:-localhost}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-postgres}
      DB_USER: ${DB_USER:-cargotracker}
      DB_PASSWORD: ${DB_PASSWORD:-cargotracker}
      # Redis connection (Amazon ElastiCache or local Redis)
      REDIS_HOST: ${REDIS_HOST:-localhost}
      REDIS_PORT: ${REDIS_PORT:-6379}
      # Graph traversal service URL
      GRAPH_TRAVERSAL_URL: ${GRAPH_TRAVERSAL_URL:-http://localhost:8080/cargo-tracker/rest/graph-traversal/shortest-path}
    volumes:
      - cargo-tracker-data:/opt/payara/cargo-tracker-data
    networks:
      - app-network
    restart: unless-stopped

volumes:
  cargo-tracker-data:
    driver: local

networks:
  app-network:
    driver: bridge
